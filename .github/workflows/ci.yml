name: Social Saver CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify source, tests, readiness and Compose
        run: ./scripts/verify.sh
      - name: Verify installed wheel outside source checkout
        run: ./scripts/check-package.sh

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Telegram bot image
        run: docker build -t social-saver-bot:ci -f Dockerfile .
      - name: Build worker image
        run: docker build -t social-saver-worker:ci -f Dockerfile.worker .
      - name: Build Mini App API image
        run: docker build -t social-saver-api:ci -f Dockerfile.api .
      - name: Import deployed services without network or real credentials
        run: |
          for service in bot worker api; do
            docker run --rm --network none \
              -e TELEGRAM_BOT_TOKEN=123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi \
              -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              "social-saver-${service}:ci" python -c "import apps.${service}.main"
          done
          docker run --rm --network none social-saver-worker:ci ffmpeg -version

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Replay migrations and prove real PGMQ worker round-trip
        run: ./scripts/test-integration.sh
