# Disposable test database only. Never mount a staging/production data directory.
services:
  database:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.postgres
    environment:
      POSTGRES_DB: social_saver_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "127.0.0.1:${SOCIAL_SAVER_TEST_PORT:-25432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d social_saver_test"]
      interval: 2s
      timeout: 3s
      retries: 30
