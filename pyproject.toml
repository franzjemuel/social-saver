[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps", "apps.*", "core", "core.*", "providers", "providers.*", "ops", "ops.*"]

[project]
name = "social-saver"
version = "3.3.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "instagrapi[curl]>=3.0.14,<4",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "upstash-redis>=1.4,<2",
  "upstash-ratelimit>=1.1,<2",
  "sentry-sdk>=2.35,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
